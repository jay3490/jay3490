<svg xmlns="http://www.w3.org/2000/svg" width="500" height="200" viewBox="0 0 500 200" role="img" aria-label="Most used languages">
  <title>Most used languages</title>
  <style>
    .title{font:600 16px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif;fill:#1f2328}
    .sub{font:400 12px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif;fill:#59636e}
    .lang{font:500 13px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif;fill:#1f2328}
    .pct{font:400 12.5px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif;fill:#59636e}
    .fade{animation:fade .6s ease backwards}
    .grow{transform-origin:24px 63px;animation:grow 1.2s cubic-bezier(.2,.8,.2,1) backwards .1s}
    @keyframes fade{from{opacity:0}}
    @keyframes grow{from{transform:scaleX(0)}}
  </style>
  <defs><clipPath id="c"><rect x="24" y="58" width="452" height="10" rx="5"/></clipPath></defs>
  <rect x=".5" y=".5" width="499" height="199" rx="12" fill="#ffffff" stroke="#d0d7de"/>
  <text x="24" y="34" class="title">Most used languages</text>
  <text x="476" y="34" class="sub" text-anchor="end">by code size</text>
  <rect x="24" y="58" width="452" height="10" rx="5" fill="#eaeef2"/>
  <g clip-path="url(#c)"><g class="grow"><rect x="24.00" y="58" width="339.84" height="10" fill="#7355dd"/><rect x="363.84" y="58" width="79.51" height="10" fill="#3572A5"/><rect x="443.36" y="58" width="13.57" height="10" fill="#3178c6"/><rect x="456.93" y="58" width="5.78" height="10" fill="#e34c26"/><rect x="462.71" y="58" width="5.46" height="10" fill="#844FBA"/><rect x="468.18" y="58" width="3.68" height="10" fill="#384d54"/><rect x="471.86" y="58" width="1.22" height="10" fill="#663399"/><rect x="473.08" y="58" width="2.92" height="10" fill="#8b949e"/></g></g>
  <g class="fade" style="animation-delay:300ms">
      <circle cx="30" cy="94" r="6" fill="#7355dd"/>
      <text x="44" y="98" class="lang">C#</text>
      <text x="234" y="98" class="pct" text-anchor="end">75.2%</text>
    </g><g class="fade" style="animation-delay:390ms">
      <circle cx="260" cy="94" r="6" fill="#3572A5"/>
      <text x="274" y="98" class="lang">Python</text>
      <text x="464" y="98" class="pct" text-anchor="end">17.6%</text>
    </g><g class="fade" style="animation-delay:480ms">
      <circle cx="30" cy="118" r="6" fill="#3178c6"/>
      <text x="44" y="122" class="lang">TypeScript</text>
      <text x="234" y="122" class="pct" text-anchor="end">3.0%</text>
    </g><g class="fade" style="animation-delay:570ms">
      <circle cx="260" cy="118" r="6" fill="#e34c26"/>
      <text x="274" y="122" class="lang">HTML</text>
      <text x="464" y="122" class="pct" text-anchor="end">1.3%</text>
    </g><g class="fade" style="animation-delay:660ms">
      <circle cx="30" cy="142" r="6" fill="#844FBA"/>
      <text x="44" y="146" class="lang">HCL</text>
      <text x="234" y="146" class="pct" text-anchor="end">1.2%</text>
    </g><g class="fade" style="animation-delay:750ms">
      <circle cx="260" cy="142" r="6" fill="#384d54"/>
      <text x="274" y="146" class="lang">Dockerfile</text>
      <text x="464" y="146" class="pct" text-anchor="end">0.8%</text>
