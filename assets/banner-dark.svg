<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="Jay Ahir — Full-Stack &amp; AI Engineer">
  <title>Jay Ahir — Full-Stack &amp; AI Engineer</title>
  <style>
    .name{font:800 64px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif;fill:#e6edf3;letter-spacing:-1px}
    .role{font:500 26px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif;fill:url(#tg)}
    .hint{font:500 15px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif;fill:#8b949e;letter-spacing:2px}
    .blob{animation:float 14s ease-in-out infinite alternate}
    .blob2{animation:float 18s ease-in-out infinite alternate-reverse}
    .caret{animation:blink 1s steps(1) infinite}
    .in{animation:in .9s ease backwards}
    @keyframes float{from{transform:translate(0,0)}to{transform:translate(-60px,24px)}}
    @keyframes blink{50%{opacity:0}}
    @keyframes in{from{opacity:0;transform:translateY(12px)}}
  </style>
  <defs>
    <linearGradient id="tg" x1="0" x2="1"><stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
    <radialGradient id="b1"><stop offset="0" stop-color="#a78bfa" stop-opacity=".35"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
    <radialGradient id="b2"><stop offset="0" stop-color="#22d3ee" stop-opacity=".3"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#30363d"/></pattern>
    <clipPath id="clip"><rect width="1200" height="260" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1200" height="260" fill="#0d1117"/>
    <rect width="1200" height="260" fill="url(#dots)" opacity=".6"/>
    <circle class="blob" cx="980" cy="60" r="260" fill="url(#b1)"/>
    <circle class="blob2" cx="760" cy="250" r="220" fill="url(#b2)"/>
  </g>
  <rect x=".5" y=".5" width="1199" height="259" rx="18" fill="none" stroke="#30363d"/>
  <text x="74" y="78" class="hint in">HI THERE, I'M</text>
  <text x="70" y="140" class="name in" style="animation-delay:.15s">Jay Ahir</text>
  <rect x="72" y="198" width="56" height="4" rx="2" fill="url(#tg)" class="in" style="animation-delay:.3s"/>
  <g style="animation:r0 12s infinite">
      <text x="72" y="182" class="role">Full-Stack &amp; AI Engineer</text></g>
    <style>@keyframes r0{0%,0.00%{opacity:0;transform:translateY(8px)}2.67%,28.67%{opacity:1;transform:none}32.00%,100%{opacity:0;transform:translateY(-8px)}}</style><g style="animation:r1 12s infinite" opacity="0">
      <text x="72" y="182" class="role">.NET · Angular · Azure · Kubernetes</text></g>
    <style>@keyframes r1{0%,33.33%{opacity:0;transform:translateY(8px)}36.00%,62.00%{opacity:1;transform:none}65.33%,100%{opacity:0;transform:translateY(-8px)}}</style><g style="animation:r2 12s infinite" opacity="0">
      <text x="72" y="182" class="role">Microservices · Event-driven · RAG &amp; LLM apps</text></g>
    <style>@keyframes r2{0%,66.67%{opacity:0;transform:translateY(8px)}69.33%,95.33%{opacity:1;transform:none}98.67%,100%{opacity:0;transform:translateY(-8px)}}</style>
  <g transform="translate(1040 130)" opacity=".9">
    <g style="animation:float 9s ease-in-out infinite alternate">
      <rect x="-70" y="-60" width="140" height="120" rx="16" fill="#161b22" stroke="#30363d"/>
      <circle cx="-48" cy="-40" r="4" fill="#ff5f57"/><circle cx="-34" cy="-40" r="4" fill="#febc2e"/><circle cx="-20" cy="-40" r="4" fill="#28c840"/>
      <rect x="-50" y="-18" width="64" height="6" rx="3" fill="#a78bfa"/>
      <rect x="-50" y="-4" width="92" height="6" rx="3" fill="#8b949e" opacity=".5"/>
      <rect x="-38" y="10" width="72" height="6" rx="3" fill="#22d3ee"/>
      <rect x="-38" y="24" width="44" height="6" rx="3" fill="#8b949e" opacity=".5"/>
      <rect x="-50" y="38" width="10" height="6" rx="1" fill="#e6edf3" class="caret"/>
    </g>
  </g>
</svg>